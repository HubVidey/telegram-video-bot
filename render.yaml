services:
  - type: web
    name: telegram-video-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --bind 0.0.0.0:$PORT bot:app

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: SOURCE_CHAT_ID
        sync: false

      - key: WEBHOOK_SECRET
        sync: false
